spring.application.name=student-service
server.port=8081
server.address=${BIND_ADDRESS:127.0.0.1}
campus.demo-password=${DEMO_PASSWORD:placement-demo}
campus.service-password=${SERVICE_PASSWORD:local-service-demo}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/student-service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
