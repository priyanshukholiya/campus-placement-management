name: Publish images

# Publishes prebuilt images to GitHub Container Registry after CI passes on main,
# so testers can run the app without compiling it (see compose.prebuilt.yaml).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: student-service, context: ., service: student-service}
          - {image: recruitment-service, context: ., service: recruitment-service}
          - {image: application-service, context: ., service: application-service}
          - {image: notification-service, context: ., service: notification-service}
          - {image: api-gateway, context: ., service: api-gateway}
          - {image: frontend, context: frontend, service: ''}
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campus-placement-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      # Both Dockerfiles compile on the native build platform and only COPY in their
      # runtime stage, so arm64 images need no QEMU emulation.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:sha-${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.title=campus-placement-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
