spring.application.name=notification-service
server.port=8084
server.address=${BIND_ADDRESS:127.0.0.1}
campus.demo-password=${DEMO_PASSWORD:placement-demo}
campus.service-password=${SERVICE_PASSWORD:local-service-demo}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/notification-service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
campus.messaging=${MESSAGING:http}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:campus}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:campus-local}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms

management.health.rabbit.enabled=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
